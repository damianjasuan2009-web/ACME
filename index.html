<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8f6">
  <meta name="description" content="Sistema de gestión de biblioteca del Colegio Marica Currea Manrique.">
  <title>Biblioteca escolar · Marica Currea Manrique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="dashboard" aria-label="Ir al inicio">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none"><rect x="4" y="6" width="13" height="28" rx="3" fill="currentColor"/><rect x="19" y="6" width="17" height="28" rx="3" fill="currentColor" opacity=".62"/><path d="M9 12h4M9 17h4M24 12h7M24 17h7" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-copy"><strong>Lectura Viva</strong><small>Biblioteca escolar</small></span>
      </a>

      <div class="school-label">INSTITUCIÓN EDUCATIVA</div>
      <div class="school-name">Colegio Marica<br>Currea Manrique</div>

      <div class="nav-caption">MENÚ PRINCIPAL</div>
      <nav class="main-nav" aria-label="Navegación principal">
        <button class="nav-link active" data-page="dashboard"><span class="nav-icon">⌂</span>Panel general</button>
        <button class="nav-link" data-page="catalog"><span class="nav-icon">▤</span>Catálogo de libros<span class="nav-count" id="nav-book-count">0</span></button>
        <button class="nav-link" data-page="loans"><span class="nav-icon">⇄</span>Préstamos<span class="nav-count" id="nav-loan-count">0</span></button>
        <button class="nav-link" data-page="students"><span class="nav-icon">♙</span>Estudiantes</button>
        <button class="nav-link" data-page="reports"><span class="nav-icon">▥</span>Informes</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="librarian-card">
          <div class="librarian-avatar">BL</div>
          <div><strong>Bibliotecario/a</strong><span>Administración</span></div>
          <span class="online-dot" title="Sesión activa"></span>
        </div>
        <div class="sidebar-foot">Un libro abre un mundo. <span>✦</span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>Biblioteca</span><span class="crumb-divider">/</span><strong id="breadcrumb-current">Panel general</strong></div>
        <div class="topbar-actions">
          <div class="today-chip"><span class="today-dot"></span><span id="today-label"></span></div>
          <button class="icon-button mobile-menu" id="menu-toggle" aria-label="Abrir menú">☰</button>
          <div class="top-avatar" title="Bibliotecario/a">BL</div>
        </div>
      </header>

      <div class="page-content">
        <section class="page-view active" id="page-dashboard"></section>
        <section class="page-view" id="page-catalog"></section>
        <section class="page-view" id="page-loans"></section>
        <section class="page-view" id="page-students"></section>
        <section class="page-view" id="page-reports"></section>
      </div>
      <footer class="footer">Lectura Viva <span>·</span> Colegio Marica Currea Manrique <span>·</span> <span id="footer-year"></span></footer>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" aria-hidden="true">
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header"><div><span class="eyebrow" id="modal-eyebrow">BIBLIOTECA ESCOLAR</span><h2 id="modal-title"></h2></div><button class="icon-button modal-close" id="modal-close" aria-label="Cerrar">×</button></div>
      <form id="modal-form"><div id="modal-fields" class="modal-fields"></div><div class="modal-actions"><button type="button" class="button button-quiet" id="modal-cancel">Cancelar</button><button type="submit" class="button button-primary" id="modal-submit">Guardar</button></div></form>
    </section>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
